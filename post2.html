    <!-- URLRewrite script: post2-এর জন্য ফিক্সড কোড হ্যান্ডেলার -->
    <script>
      (function() {
        // বর্তমান পেজের নাম শনাক্তকরণ
        const pagePath = window.location.pathname.split('/').pop() || 'post2.html';
        const pageKey = 'saved_code_' + pagePath;
        
        // LocalStorage থেকে পূর্বে সেভ করা কোড দেখা
        let randomCode = localStorage.getItem(pageKey);

        // সেভ করা না থাকলে নতুন ৬ অক্ষরের কোড জেনারেট করবে
        if (!randomCode) {
          const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
          randomCode = '';
          for (for i = 0; i < 6; i++) {
            randomCode += chars.charAt(Math.floor(Math.random() * chars.length));
          }
          localStorage.setItem(pageKey, randomCode);
        }

        // URL পরিবর্তন করে https://xx727.github.io/post=xY2f8R ফরম্যাট করা
        const newUrl = window.location.origin + '/post=' + randomCode;
        window.history.replaceState(null, '', newUrl);
      })();
    </script>
