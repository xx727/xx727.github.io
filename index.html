<!DOCTYPE html>
<html lang="bn">
<head>
    <meta name="monetag" content="f1e2f2d5cd4c92a4ba9dc696acf32ef1">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xx727 - Download & Stream Online</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        /* Adsterra 320x50 Ad Placement */
        .ad-320x50 {
            width: 320px;
            height: 50px;
            margin: 10px auto 20px;
            background-color: #1e293b;
            border: 1px dashed #475569;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            overflow: hidden;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 2px solid #1e293b;
            text-align: center;
        }

        /* Post Card Styling */
        .post-card {
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            margin-bottom: 25px;
            transition: transform 0.2s ease;
            text-align: center;
        }

        .post-card:hover {
            transform: translateY(-3px);
        }

        .thumbnail-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            overflow: hidden;
        }

        .thumbnail-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-details {
            padding: 16px;
            text-align: center;
        }

        .post-title-link {
            text-decoration: none;
            color: #f1f5f9;
            font-size: 18px;
            font-weight: 600;
            line-height: 1.4;
            display: inline-block;
            transition: color 0.2s ease;
            text-align: center;
        }

        .post-title-link:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- ১. Adsterra 320x50 ব্যানার এড -->
        <div class="ad-320x50">
            <span style="font-size: 11px; color: #64748b;">Adsterra 320x50 Ad</span>
        </div>

        <!-- ২. টাইটেল -->
        <h2 class="section-title">নতুন পোস্ট গুলো দেখুন</h2>

        <!-- ৩. পোস্ট ১ -->
        <div class="post-card">
            <div class="thumbnail-wrapper">
                <img src="https://i.ibb.co/6y4jG04/sample-thumb.jpg" alt="Post 1 Thumbnail">
            </div>
            <div class="post-details">
                <a href="post1.html" class="post-title-link">
                    প্রিমিয়াম অ্যাপ বা গেমের বিস্তারিত ও ডাউনলোডের নিয়মাবলী [২০২৬ সংস্করণ]
                </a>
            </div>
        </div>

        <!-- ৪. পোস্ট ২ -->
        <div class="post-card">
            <div class="thumbnail-wrapper">
                <img src="https://i.ibb.co/6y4jG04/sample-thumb.jpg" alt="Post 2 Thumbnail">
            </div>
            <div class="post-details">
                <a href="post2.html" class="post-title-link">
                    দ্বিতীয় প্রিমিয়াম অ্যাপের আপডেট ও ফুল ভার্সন ডাউনলোড গাইড
                </a>
            </div>
        </div>

    </div>

    <!-- URL এবং ইউনিক কোড হ্যান্ডেল করার স্ক্রিপ্ট -->
    <script>
        document.querySelectorAll('a.post-title-link').forEach(link => {
            link.addEventListener('click', function(e) {
                const pagePath = this.getAttribute('href');
                const pageKey = 'saved_code_' + pagePath;
                
                // যদি আগে থেকে এই পেজের কোড না থাকে তবে তৈরি করবে
                if (!localStorage.getItem(pageKey)) {
                    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
                    let randomCode = '';
                    for (let i = 0; i < 6; i++) {
                        randomCode += chars.charAt(Math.floor(Math.random() * chars.length));
                    }
                    localStorage.setItem(pageKey, randomCode);
                }
            });
        });
    </script>
</body>
</html>
