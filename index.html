    function generateFixedCode(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            const char = str.charCodeAt(i);
            hash = (hash << 5) - hash + char;
            hash |= 0;
        }
        const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        let code = "";
        let absHash = Math.abs(hash);
        
        while (absHash > 0 && code.length < 6) {
            code += chars.charAt(absHash % chars.length);
            absHash = Math.floor(absHash / chars.length);
        }
        
        while (code.length < 6) {
            code += "x";
        }
        return code;
    }

        const paginatedItems = postsData.slice(start, end);

        paginatedItems.forEach((post, index) => {
            const postElement = document.createElement('div');
            postElement.classList.add('post-card');
            const realIndex = start + index;
            postElement.innerHTML = generatePostHTML(post, realIndex);
            postsContainer.appendChild(postElement);
        });
    }

    function setupPagination() {
        const paginationContainer = document.getElementById('pagination-container');
        paginationContainer.innerHTML = "";

        const pageCount = Math.ceil(postsData.length / postsPerPage);
        
        for (let i = 1; i <= pageCount; i++) {
            const btn = document.createElement('button');
            btn.classList.add('page-link');
            btn.innerText = "পেজ " + i;
            
            if (currentPage === i) btn.classList.add('active');

            btn.addEventListener('click', function () {
                currentPage = i;
                displayPosts(currentPage);
                document.querySelector('.page-link.active').classList.remove('active');
                btn.classList.add('active');
                window.scrollTo({top: 0, behavior: 'smooth'});
            });

            paginationContainer.appendChild(btn);
        }
    }

    function toggleSearchBox() {
        const searchContainer = document.getElementById('search-box-container');
        const searchInput = document.getElementById('search-input');
        
        if (searchContainer.style.display === "none" || searchContainer.style.display === "") {
            searchContainer.style.display = "block";
            searchInput.focus();
        } else {
            searchContainer.style.display = "none";
            searchInput.value = "";
            displayPosts(currentPage); 
            document.getElementById('pagination-container').style.display = "flex"; 
        }
    }

    function searchPosts() {
        const query = document.getElementById('search-input').value.toLowerCase().trim();
        const postsContainer = document.getElementById('posts-container');
        const paginationContainer = document.getElementById('pagination-container');
        
        if (query === "") {
            displayPosts(currentPage);
            paginationContainer.style.display = "flex";
            return;
        }

        const filteredPosts = postsData.filter(post => post.title.toLowerCase().includes(query));
        
        postsContainer.innerHTML = "";
        paginationContainer.style.display = "none"; 

        if (filteredPosts.length === 0) {
            postsContainer.innerHTML = `<div style="text-align:center; padding:30px; color:#aaa; font-size:15px;">দুঃখিত! এই নামে কোনো ফাইল পাওয়া যায়নি।</div>`;
            return;
        }

        filteredPosts.forEach((post) => {
            const realIndex = postsData.findIndex(p => p.title === post.title);
            const postElement = document.createElement('div');
            postElement.classList.add('post-card');
            postElement.innerHTML = generatePostHTML(post, realIndex);
            postsContainer.appendChild(postElement);
        });
    }

    function navigateToDownload(index) {
        const randomCode = postCodeMap[index];
        history.pushState({postIndex: index}, "", `?post=${randomCode}`);
        openDownloadPage(index);
    }

    function openDownloadPage(index) {
    const selectedPost = postsData[index];
    activeDownloadUrl = selectedPost.downloadUrl;
    currentPostTitle = selectedPost.title;
    currentPostImage = selectedPost.image; 

    document.getElementById('target-post-title').innerText = selectedPost.title;
    document.getElementById('target-file-name').innerText = selectedPost.title.split(" Download")[0];
    document.getElementById('target-file-size').innerText = selectedPost.fileSize || "N/A";

    document.getElementById('action-btn').style.display = "flex";
    document.getElementById('timer-container').style.display = "none";
    document.getElementById('final-download-btn').style.display = "none";
    document.getElementById('download-page-share-panel').style.display = "none"; 

    document.getElementById('home-page').style.display = "none";
    document.getElementById('download-page').style.display = "block";
    window.scrollTo({top: 0, behavior: 'smooth'});

    loadDownloadPageAd();

    // লিংকের শেষ থেকে &m=1 রিমুভ করার লজিক
    const currentUrl = window.location.href.replace(/[?&]m=1/, '');
    const boldTitle = makeUnicodeBold(selectedPost.title);
    
    // টেলিগ্রাম শেয়ার টেক্সট (১০০% নিখুঁত ফরম্যাট)
    const tgShareText = encodeURIComponent("🔥 " + boldTitle + "\n\n📥 ফাইলটি ডাউনলোড করতে নিচের লিংকে ক্লিক করুন! 🔰\n\n" + currentUrl + "\n\n");
    document.getElementById('share-link-tg').href = "https://t.me/share/url?url=&text=" + tgShareText;
    
    // হোয়াটসঅ্যাপ ও ফেসবুক শেয়ার লিংক
    const generalShareText = encodeURIComponent("🔥 ডাউনলোড করুন: " + boldTitle + "\n🔗 ডাউনলোড লিংক: " + currentUrl);
    document.getElementById('share-link-wa').href = "https://api.whatsapp.com/send?text=" + generalShareText;
    document.getElementById('share-link-fb').href = "https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(currentUrl);
}

    function loadDownloadPageAd() {
        const adContainer = document.getElementById('download-page-ad-container');
        if (!adContainer) return;
        adContainer.innerHTML = ""; 

        const scriptTag = document.createElement('script');
        scriptTag.async = true;
        scriptTag.setAttribute('data-cfasync', 'false');
        scriptTag.src = "https://pl29634924.effectivecpmnetwork.com/fc65c8a838393ae5421b71db6840081a/invoke.js";

        const placeholderDiv = document.createElement('div');
        placeholderDiv.id = "container-fc65c8a838393ae5421b71db6840081a";

        adContainer.appendChild(scriptTag);
        adContainer.appendChild(placeholderDiv);
    }

    function startVerification() {
        document.getElementById('action-btn').style.display = "none"; 
        document.getElementById('timer-container').style.display = "block"; 

        let timeLeft = 10; 
        const countdownNumber = document.getElementById('countdown-number');

        const timerInterval = setInterval(() => {
            timeLeft--;
            countdownNumber.innerText = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                document.getElementById('timer-container').style.display = "none"; 
                
                const finalBtn = document.getElementById('final-download-btn');
                finalBtn.href = activeDownloadUrl;
                finalBtn.setAttribute('target', '_blank'); 
                finalBtn.style.display = "flex"; 
            }
        }, 1000);
    }

    function goToHome() {
        history.pushState(null, "", window.location.pathname);
        checkRoute();
    }

    function checkRoute() {
        const urlParams = new URLSearchParams(window.location.search);
        const postCode = urlParams.get('post');
        
        if (postCode !== null) {
            const index = codeToIndexMap[postCode];
            if (index !== undefined && postsData[index]) {
                openDownloadPage(index);
                return;
            }
        }
        document.getElementById('download-page').style.display = "none";
        document.getElementById('home-page').style.display = "block";
    }

    window.addEventListener('popstate', checkRoute);
    
    if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', checkRoute);
    } else {
        checkRoute();
    }

    displayPosts(currentPage);
    setupPagination();
</script>

</body>
</html>
